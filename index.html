<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar do Antônio</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <h1>Bar do Antônio</h1>
    </header>

    <main class="container">
        <!-- TELA 1: Menu Inicial e Busca -->
        <section id="tela-menu" class="tela ativa">
            <div class="busca-container">
                <input type="text" id="busca-cliente" placeholder="Buscar cliente..." aria-label="Buscar cliente">
            </div>
            <ul id="lista-clientes" class="lista-clientes"></ul>
        </section>

        <!-- TELA 2: Lançamento -->
        <section id="tela-lancamento" class="tela oculta">
            <div class="cabecalho-tela">
                <button id="btn-voltar-lancamento" class="btn-voltar">← Voltar</button>
                <h2>Novo Lançamento</h2>
            </div>
            <div class="info-cliente">
                <p>Cliente: <strong id="nome-cliente-lancamento">---</strong></p>
            </div>
            <div class="form-lancamento">
                <label for="valor-lancamento">Valor do Consumo (R$)</label>
                <input type="number" id="valor-lancamento" placeholder="0.00" step="0.01" min="0.01">
                <button id="btn-confirmar-lancamento" class="btn btn-primario btn-grande">Confirmar Lançamento</button>
            </div>
        </section>

        <!-- TELA 3: Alerta e Resultado -->
        <section id="tela-resultado" class="tela oculta">
            <div class="alerta-sucesso">
                <span class="icone-sucesso">✔</span>
                <h2>Lançamento Concluído!</h2>
            </div>
            <div class="extrato">
                <p>Cliente: <strong id="res-nome">---</strong></p>
                <p>Valor Adicionado: <strong id="res-valor" class="texto-vermelho">---</strong></p>
                <hr>
                <p class="saldo-total">Novo Saldo Pendente:<br><strong id="res-saldo">---</strong></p>
            </div>
            <button id="btn-voltar-inicio" class="btn btn-primario btn-grande" style="margin-top: 20px;">Voltar ao Menu Inicial</button>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
