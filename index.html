<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar do Toninho</title>
    <meta name="description" content="Aplicativo PWA para controlo de vendas e fiado no balcão">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <!-- ECRÃ 1: Menu Inicial e Busca -->
        <section id="tela-menu" class="tela ativa">
            <header class="cabecalho">
                <h1>Bar do Toninho</h1>
                <span class="icone-offline">📴</span>
            </header>
            <div class="container">
                <div class="busca-container">
                    <input type="text" id="busca-cliente" placeholder="Buscar cliente pelo nome 🔍">
                </div>
                <button class="btn btn-azul btn-novo-cliente">+ NOVO CLIENTE</button>
                <ul id="lista-clientes" class="lista-clientes"></ul>
            </div>
        </section>

        <!-- ECRÃ 2: Lançamento -->
        <section id="tela-lancamento" class="tela oculta">
            <header class="cabecalho cabecalho-secundario">
                <button id="btn-voltar-lancamento" class="btn-icone">←</button>
                <h2>Lançamento</h2>
                <div style="width: 24px;"></div> <!-- Espaçador para centrar o título -->
            </header>
            <div class="container">
                <h3 class="titulo-cliente">Cliente: <span id="nome-cliente-lancamento">---</span></h3>
                
                <div class="form-lancamento">
                    <label for="valor-lancamento">Valor (R$)</label>
                    <input type="number" id="valor-lancamento" placeholder="0,00" step="0.01" min="0.01">
                    
                    <div class="botoes-tipo">
                        <button id="btn-tipo-compra" class="btn-tipo ativo">Compra (+)<br>(+)</button>
                        <button id="btn-tipo-pagamento" class="btn-tipo">Pagamento<br>(-)</button>
                    </div>

                    <button id="btn-confirmar-lancamento" class="btn btn-azul btn-grande">CONFIRMAR LANÇAMENTO</button>
                    <button id="btn-cancelar-lancamento" class="btn btn-contorno btn-grande">CANCELAR</button>
                </div>
            </div>
        </section>

        <!-- ECRÃ 3: Alerta e Resultado -->
        <section id="tela-resultado" class="tela oculta">
            <div class="container">
                <div class="alerta-sucesso">
                    ✓ Lançamento salvo com sucesso!
                </div>
                
                <div class="extrato-centro">
                    <h3>Novo Saldo Total:</h3>
                    <h2 id="res-saldo">R$ 0,00</h2>
                </div>

                <div class="historico-recente">
                    <h4 id="titulo-historico">Histórico Recente de ---</h4>
                    <hr>
                    <p id="linha-historico">---</p>
                    <hr>
                </div>

                <button id="btn-voltar-inicio" class="btn btn-escuro btn-grande">VOLTAR AO MENU</button>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
